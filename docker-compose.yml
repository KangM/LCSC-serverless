services:
  app:
    build:
      context: .
      args:
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-}
        GIT_COMMIT_MESSAGE: ${GIT_COMMIT_MESSAGE:-}
        GIT_COMMIT_TIME: ${GIT_COMMIT_TIME:-}
    restart: unless-stopped
    ports:
      - "3000:3000"
      # 让 http://<主机名>.local（不带端口）也能直接访问：浏览器默认走 80。
      # 两条都保留 —— 局域网里可能有人收藏了 :3000 的地址，改掉会失效。
      # 服务器上 80 若被 nginx 等占用，删掉这一行即可回滚。
      - "80:3000"
    environment:
      DATABASE_MODE: sqlite
      SQLITE_DATABASE_PATH: /data/inventory.db
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
      PERF_LOG: ${PERF_LOG:-1}
    volumes:
      - ./data:/data

  cron:
    profiles: ["cron"]
    build:
      context: .
      args:
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-}
        GIT_COMMIT_MESSAGE: ${GIT_COMMIT_MESSAGE:-}
        GIT_COMMIT_TIME: ${GIT_COMMIT_TIME:-}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    command: ["node", "scripts/cron-refresh.mjs"]
    environment:
      DATABASE_MODE: sqlite
      SQLITE_DATABASE_PATH: /data/inventory.db
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
      CRON_TARGET_URL: http://app:3000/api/cron/refresh
