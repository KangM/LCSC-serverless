[permissions]
allow = ["Bash=cd /e/Code/LCSC_Vercel && npm ls server-only 2>&1 | head -5; echo \"---node 运行测试---\"; node --input-type=module -e \"import 'server-only'; console.log('server-only import OK')\" 2>&1 | head -5", "Bash=cd /e/Code/LCSC_Vercel && powershell -Command \"Get-Process node -ErrorAction SilentlyContinue | Stop-Process -Force\" 2>/dev/null; git add -A && git status --short", "Bash=sleep 10\nB=http://localhost:3000\ncurl -s -c /tmp/c.txt -X POST $B/api/auth/login -H \"Content-Type: application/json\" -d '{\"password\":\"test123\"}' -o /dev/null\necho \"== 页面渲染 ==\"\nfor p in / /components /transactions /import /settings; do\n  curl -s -b /tmp/c.txt -o /dev/null -w \"$p -> HTTP %{http_code}\\n\" $B$p\ndone\necho \"== 乱码验证 1：curl 直接发中文（git-bash 默认 GBK → 应乱码） ==\"\ncurl -s -b /tmp/c.txt -X POST $B/api/components/C14663/stock -H \"Content-Type: application/json\" -d '{\"action\":\"in\",\"quantity\":1,\"note\":\"中文备注测试\"}' -o /dev/null\ncurl -s -b /tmp/c.txt \"$B/api/export/transactions?pn=C14663\" | tail -1 | cut -d',' -f7\necho \"== 乱码验证 2：node fetch 发 UTF-8 中文（应用真实路径 → 应正常） ==\"\nnode --input-type=module -e \"\nconst res = await fetch('http://localhost:3000/api/components/C14663/stock', {\n  method: 'POST',\n  headers: { 'Content-Type': 'application/json', Cookie: (await (await fetch('http://localhost:3000/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: 'test123' }) })).headers.get('set-cookie')).split(';')[0] },\n  body: JSON.stringify({ action: 'in', quantity: 1, note: 'UTF8中文正常' }),\n})\nconsole.log('POST:', res.status)\n\" 2>/dev/null\ncurl -s -b /tmp/c.txt \"$B/api/export/transactions?pn=C14663\" | grep -c \"UTF8中文正常\" || echo \"grep 失败（编码），改用 python\"\ncurl -s -b /tmp/c.txt \"$B/api/export/transactions?pn=C14663\" | python -c \"\nimport sys\ndata = sys.stdin.buffer.read().decode('utf-8')\nfor line in data.splitlines():\n    if 'UTF8' in line or '中文' in line or '&#' in line:\n        print('行内容(UTF-8解码):', line.split(',')[6] if len(line.split(','))>6 else line)\n\""]
